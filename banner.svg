<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Thanks, Obama. A retro atomic-age banner: a 1950s-style politician at a podium points at someone offscreen while a martini, a coffee cup and a soda are raised in a toast.">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2" fill="#e76f51" opacity="0.18"/>
    </pattern>
    <!-- 4-point atomic sparkle -->
    <symbol id="sparkle" viewBox="-20 -20 40 40">
      <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z"/>
    </symbol>
    <!-- starburst -->
    <symbol id="burst" viewBox="-50 -50 100 100">
      <g stroke-linecap="round" stroke-width="4">
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
        <line x1="-18" y1="-44" x2="18" y2="44"/>
        <line x1="-44" y1="-18" x2="44" y2="18"/>
        <line x1="-44" y1="18" x2="44" y2="-18"/>
        <line x1="-18" y1="44" x2="18" y2="-44"/>
      </g>
    </symbol>
  </defs>

  <!-- cream background with halftone -->
  <rect width="1200" height="420" fill="#f4ead5"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- big mid-century blobs -->
  <path d="M-20 60 Q120 -20 300 40 Q470 100 420 230 Q380 340 200 330 Q40 320 -20 260 Z" fill="#2a9d8f" opacity="0.9"/>
  <path d="M560 40 Q700 0 900 30 Q1120 60 1180 150 Q1230 240 1100 280 Q900 330 720 290 Q560 250 540 160 Q530 80 560 40 Z" fill="#e9c46a" opacity="0.55"/>

  <!-- boomerangs -->
  <g fill="#e76f51">
    <path d="M470 330 Q500 290 545 300 Q515 305 500 345 Z"/>
    <path d="M1080 330 Q1110 300 1150 315 Q1118 318 1100 352 Z"/>
  </g>
  <g fill="#264653">
    <path d="M440 60 Q470 30 510 40 Q478 46 462 80 Z"/>
  </g>

  <!-- starbursts and sparkles -->
  <g stroke="#264653"><use href="#burst" x="395" y="290" width="50" height="50"/></g>
  <g stroke="#e76f51"><use href="#burst" x="1110" y="20" width="70" height="70"/></g>
  <g stroke="#2a9d8f"><use href="#burst" x="600" y="300" width="44" height="44"/></g>
  <g fill="#264653">
    <use href="#sparkle" x="525" y="230" width="28" height="28"/>
    <use href="#sparkle" x="1050" y="250" width="22" height="22"/>
    <use href="#sparkle" x="380" y="20" width="24" height="24"/>
  </g>
  <g fill="#e76f51">
    <use href="#sparkle" x="560" y="20" width="30" height="30"/>
    <use href="#sparkle" x="25" y="345" width="26" height="26"/>
  </g>

  <!-- ===== 1950s politician (geometric, no likeness) ===== -->
  <g transform="translate(60,10)">
    <!-- suit body -->
    <path d="M115 300 L130 205 Q140 190 180 188 Q220 190 230 205 L245 300 Z" fill="#264653"/>
    <!-- lapels and shirt -->
    <path d="M165 190 L180 240 L195 190 Z" fill="#f4ead5"/>
    <path d="M165 190 L150 215 L178 238 Z" fill="#1d3640"/>
    <path d="M195 190 L210 215 L182 238 Z" fill="#1d3640"/>
    <!-- skinny tie -->
    <path d="M177 196 L183 196 L186 232 L180 240 L174 232 Z" fill="#e76f51"/>
    <!-- head: rounded square, 50s cartoon style -->
    <rect x="148" y="112" width="64" height="72" rx="26" fill="#f2c9a0" stroke="#264653" stroke-width="3"/>
    <!-- slicked hair -->
    <path d="M146 140 Q146 104 182 104 Q216 104 214 132 Q200 118 176 122 Q158 126 150 146 Z" fill="#264653"/>
    <!-- eyes and grin -->
    <circle cx="168" cy="148" r="3.5" fill="#264653"/>
    <circle cx="194" cy="148" r="3.5" fill="#264653"/>
    <path d="M166 164 Q181 176 196 164" stroke="#264653" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- pointing arm -->
    <path d="M225 212 L320 170" stroke="#264653" stroke-width="24" stroke-linecap="round"/>
    <circle cx="328" cy="166" r="12" fill="#f2c9a0" stroke="#264653" stroke-width="3"/>
    <path d="M338 161 L366 150" stroke="#f2c9a0" stroke-width="8" stroke-linecap="round"/>
    <path d="M338 161 L366 150" stroke="#264653" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <!-- action lines -->
    <g stroke="#e76f51" stroke-width="4" stroke-linecap="round">
      <line x1="378" y1="132" x2="398" y2="120"/>
      <line x1="383" y1="148" x2="407" y2="145"/>
      <line x1="379" y1="164" x2="399" y2="171"/>
    </g>
    <!-- vintage ribbon microphone -->
    <path d="M180 262 L180 236" stroke="#8a8a8a" stroke-width="4"/>
    <rect x="166" y="210" width="28" height="30" rx="12" fill="#c0c0c0" stroke="#264653" stroke-width="3"/>
    <g stroke="#264653" stroke-width="1.5"><line x1="170" y1="220" x2="190" y2="220"/><line x1="170" y1="226" x2="190" y2="226"/><line x1="170" y1="232" x2="190" y2="232"/></g>
    <!-- tapered podium -->
    <path d="M90 270 L270 270 L250 370 L110 370 Z" fill="#e76f51"/>
    <path d="M110 300 L250 300" stroke="#f4ead5" stroke-width="3"/>
    <path d="M114 340 L246 340" stroke="#f4ead5" stroke-width="3"/>
    <rect x="80" y="258" width="200" height="16" rx="8" fill="#264653"/>
    <!-- atom emblem -->
    <g transform="translate(180,320)" fill="none" stroke="#264653" stroke-width="3">
      <circle r="27" fill="#f4ead5"/>
      <ellipse rx="20" ry="7"/>
      <ellipse rx="20" ry="7" transform="rotate(60)"/>
      <ellipse rx="20" ry="7" transform="rotate(-60)"/>
      <circle r="3.5" fill="#e76f51" stroke="none"/>
    </g>
    <!-- tapered legs on podium -->
    <path d="M118 370 L108 395 M242 370 L252 395" stroke="#264653" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M30 28 H340 Q362 28 362 50 V96 Q362 118 340 118 H215 L188 146 L190 118 H30 Q8 118 8 96 V50 Q8 28 30 28 Z" fill="#f4ead5" stroke="#264653" stroke-width="4"/>
    <text x="185" y="66" text-anchor="middle" font-family="'Trebuchet MS', 'Century Gothic', Futura, sans-serif" font-size="21" font-weight="bold" fill="#264653">Gee whiz, folks, this mess was</text>
    <text x="185" y="98" text-anchor="middle" font-family="'Trebuchet MS', 'Century Gothic', Futura, sans-serif" font-size="25" font-weight="bold" fill="#e76f51" letter-spacing="1">ALL HIS FAULT!</text>
  </g>

  <!-- ===== title ===== -->
  <g transform="translate(835,160) skewX(-10)" text-anchor="middle" font-family="Futura, 'Century Gothic', 'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900">
    <text x="7" y="7" font-size="80" fill="#264653" letter-spacing="2">THANKS, OBAMA.</text>
    <text x="0" y="0" font-size="80" fill="#e76f51" stroke="#264653" stroke-width="3" paint-order="stroke" letter-spacing="2">THANKS, OBAMA.</text>
  </g>

  <!-- script subtitle on a ribbon -->
  <g transform="translate(840,218)">
    <path d="M-250 -26 L250 -26 L232 0 L250 26 L-250 26 L-232 0 Z" fill="#2a9d8f" stroke="#264653" stroke-width="3"/>
    <text x="0" y="11" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive" font-size="36" fill="#f4ead5">A drinking game for our time!</text>
  </g>

  <!-- ===== raised drinks ===== -->
  <g transform="translate(700,262)">
    <!-- martini -->
    <g transform="rotate(-14 45 55)" stroke="#264653" stroke-width="3" stroke-linejoin="round">
      <path d="M8 18 L82 18 L45 62 Z" fill="#9ed8d0"/>
      <line x1="45" y1="62" x2="45" y2="100"/>
      <path d="M26 104 Q45 96 64 104" fill="none"/>
      <line x1="30" y1="10" x2="58" y2="44"/>
      <circle cx="54" cy="39" r="7" fill="#7cb342"/>
      <circle cx="54" cy="39" r="2.5" fill="#e76f51" stroke="none"/>
    </g>
    <!-- diner coffee cup and saucer -->
    <g transform="translate(130,22)" stroke="#264653" stroke-width="3">
      <path d="M12 28 L80 28 L72 76 Q46 88 20 76 Z" fill="#f4ead5"/>
      <path d="M78 38 Q100 40 96 56 Q92 70 74 66" fill="none"/>
      <ellipse cx="46" cy="84" rx="48" ry="8" fill="#e9c46a"/>
      <path d="M22 46 L70 46" stroke="#e76f51" stroke-width="5"/>
      <g fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M34 18 Q28 8 36 -2"/><path d="M52 18 Q46 8 54 -2"/>
      </g>
    </g>
    <!-- soda pop bottle -->
    <g transform="translate(270,-6) rotate(13 30 60)" stroke="#264653" stroke-width="3" stroke-linejoin="round">
      <path d="M22 0 L38 0 L38 22 Q52 40 50 60 Q46 80 52 96 L52 112 L8 112 L8 96 Q14 80 10 60 Q8 40 22 22 Z" fill="#7fc8b8"/>
      <rect x="20" y="-6" width="20" height="8" rx="2" fill="#e76f51"/>
      <rect x="10" y="66" width="40" height="22" fill="#e76f51"/>
      <text x="30" y="82" text-anchor="middle" font-family="'Brush Script MT', cursive" font-size="15" fill="#f4ead5" stroke="none">Pop!</text>
      <line x1="34" y1="-6" x2="46" y2="-36" stroke="#e76f51" stroke-width="4"/>
    </g>
    <!-- clink sparkles -->
    <g fill="#e76f51">
      <use href="#sparkle" x="104" y="0" width="26" height="26"/>
      <use href="#sparkle" x="240" y="0" width="22" height="22"/>
    </g>
  </g>

  <!-- ===== bulletin strip ===== -->
  <rect x="0" y="384" width="1200" height="36" fill="#264653"/>
  <g transform="translate(14,389)">
    <rect width="170" height="26" rx="13" fill="#e76f51"/>
    <text x="85" y="19" text-anchor="middle" font-family="Futura, 'Century Gothic', 'Trebuchet MS', sans-serif" font-weight="900" font-size="17" fill="#f4ead5" letter-spacing="2">NEWSFLASH!</text>
  </g>
  <text x="200" y="409" font-family="'Century Gothic', Futura, 'Trebuchet MS', sans-serif" font-size="17" font-weight="bold" fill="#f4ead5" letter-spacing="0.5">Nothing actually broke  ✦  Politician blames predecessor  ✦  Everyone drinks  ✦  Pace yourself, drink water</text>
</svg>
